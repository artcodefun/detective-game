server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /og.png {
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~ ^/(favicon\.png|icon-512\.png|apple-touch-icon\.png)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~ /\. {
        deny all;
    }
}
